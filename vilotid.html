<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Report - Aathish Åkeri AB</title>
    <style>
        :root {
            --paper-bg: #ffffff;
            --border-color: #000000;
            --accent: #2563eb;
            --success: #16a34a;
            --danger: #dc2626;
            --secondary: #475569;
            --neutral: #64748b;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .sheet-container {
            width: 100%;
            max-width: 550px;
            background: var(--paper-bg);
            border: 2px solid var(--border-color);
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .sheet-header-title {
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-style: italic;
        }

        .top-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
        }

        .top-table td {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
            vertical-align: middle;
        }

        .company-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .company-logo-svg {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }

        .company-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #0f172a;
            line-height: 1.2;
        }

        .block-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            border: 2px solid var(--border-color);
        }

        .block-table td {
            border: 1px solid var(--border-color);
            padding: 6px 8px;
        }

        .block-header-row td {
            background-color: #f8fafc;
        }

        .label-sm {
            font-size: 0.75rem;
            color: #333;
            display: block;
        }

        .title-lg {
            font-size: 1.1rem;
            font-weight: bold;
        }

        input[type="text"],
        input[type="date"],
        input[type="time"] {
            width: 100%;
            border: none;
            outline: none;
            font-size: 1rem;
            font-weight: bold;
            background: transparent;
            font-family: monospace;
        }

        .time-range-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .current-time-box {
            background: #e2e8f0;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn {
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            flex: 2;
        }

        .btn-reset {
            background-color: var(--secondary);
            flex: 1;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
        }

        .result-card {
            background: white;
            padding: 12px;
            border-radius: 4px;
            border-left: 5px solid var(--accent);
            margin-bottom: 12px;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .badge {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
            float: right;
        }

        .bg-ok {
            background-color: var(--success);
        }

        .bg-danger {
            background-color: var(--danger);
        }

        .bg-info {
            background-color: var(--neutral);
        }

        .copyright-footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            border-top: 1px dashed var(--border-color);
            padding-top: 10px;
        }
    </style>
</head>

<body>

    <div class="sheet-container">

        <div class="sheet-header-title">
            Original. Tear at perforation
        </div>

        <!-- Company Top Header Table -->
        <table class="top-table">
            <tr>
                <td style="width: 65%;">
                    <div class="company-brand">
                        <svg class="company-logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="100" cy="100" r="95" fill="none" stroke="#2c3e50" stroke-width="4" />
                            <path id="textPath1" d="M 30,100 A 70,70 0 0,1 170,100" fill="none" />
                            <text font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50"
                                text-anchor="middle">
                                <textPath href="#textPath1" startOffset="50%">Aathish Åkeri AB</textPath>
                            </text>
                            <path
                                d="M 100,65 L 100,135 M 75,90 L 125,90 M 100,65 A 10,10 0 1,1 100,45 A 10,10 0 1,1 100,65 M 70,125 C 70,150 130,150 130,125"
                                fill="none" stroke="#2c3e50" stroke-width="8" stroke-linecap="round" />
                            <path d="M 60,115 L 70,125 L 80,115 M 140,115 L 130,125 L 120,115" fill="none"
                                stroke="#2c3e50" stroke-width="6" stroke-linecap="round" />
                            <path id="textPath2" d="M 170,100 A 70,70 0 0,1 30,100" fill="none" />
                            <text font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50"
                                text-anchor="middle">
                                <textPath href="#textPath2" startOffset="50%">Taxi and Transport</textPath>
                            </text>
                            <text x="35" y="105" font-family="Arial, sans-serif" font-size="10" fill="#8b7355"
                                font-weight="bold">EST.</text>
                            <text x="142" y="105" font-family="Arial, sans-serif" font-size="10" fill="#8b7355"
                                font-weight="bold">2020</text>
                        </svg>
                        <div>
                            <span class="company-name">Aathish Åkeri AB</span>
                            <div style="font-size: 0.75rem; color: #64748b;">Taxi and Transport</div>
                        </div>
                    </div>
                </td>
                <td>
                    <span class="label-sm">Employer No.</span>
                    <input type="text" id="employerNo" value="1">
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <span class="label-sm">Driver's Name</span>
                    <input type="text" id="driverName" placeholder="First and last name" value="">
                </td>
            </tr>
        </table>

        <!-- Current Time Box -->
        <div class="current-time-box">
            <span>⏱️ Current Time:</span>
            <input type="time" id="currentTime" style="width: 100px; text-align: right;">
        </div>

        <!-- Rest Time Blocks -->
        <div id="blocksContainer"></div>

        <div class="button-group">
            <button class="btn" onclick="calculateVilotidCorrect()">Calculate Rest Time</button>
            <button class="btn btn-reset" onclick="resetAllFields()">Reset Form</button>
        </div>

        <div class="result-box" id="results" style="display:none;">
            <h3 style="margin-top:0; font-size:1rem;">📊 Summary Results (Aathish Åkeri AB):</h3>
            <div id="resultsList"></div>
        </div>

        <!-- Copyright Footer -->
        <div class="copyright-footer">
            © 2017-2026 Aathish Åkeri AB. All Rights Reserved.
        </div>
    </div>

    <script>
        function getPastDateStr(daysAgo) {
            const d = new Date();
            d.setDate(d.getDate() - daysAgo);
            return d.toISOString().split('T')[0];
        }

        const prefilledData = [
            { date: getPastDateStr(2), s1: "00:00", e1: "13:08", s2: "21:05", e2: "22:05" },
            { date: getPastDateStr(1), s1: "00:29", e1: "16:47", s2: "20:32", e2: "21:33" },
            { date: getPastDateStr(0), s1: "04:17", e1: "13:35", s2: "18:55", e2: "20:55" }
        ];

        const container = document.getElementById('blocksContainer');

        function renderBlocks(data) {
            container.innerHTML = '';
            data.forEach((item, i) => {
                container.innerHTML += `
                <table class="block-table" id="block_${i}">
                    <tr class="block-header-row">
                        <td style="width: 40%;"><span class="title-lg">Rest Time</span></td>
                        <td>
                            <span class="label-sm">Date</span>
                            <input type="date" id="date_${i}" value="${item.date}">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <label style="display:inline-flex;align-items:center;gap:8px;font-weight:bold;">
                                <input type="checkbox" id="fullRest_${i}" ${item.fullRest ? 'checked' : ''} onchange="toggleFullRest(${i})">
                                Didn't work / full rest day
                            </label>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <span class="label-sm">From — To (Period 1)</span>
                            <div class="time-range-row">
                                <input type="time" id="start1_${i}" value="${item.s1}">
                                <span>–</span>
                                <input type="time" id="end1_${i}" value="${item.e1}">
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <span class="label-sm">From — To (Period 2)</span>
                            <div class="time-range-row">
                                <input type="time" id="start2_${i}" value="${item.s2}">
                                <span>–</span>
                                <input type="time" id="end2_${i}" value="${item.e2}">
                            </div>
                            <label style="display:inline-flex;align-items:center;gap:8px;font-weight:bold;margin-top:8px;">
                                <input type="checkbox" id="noRest2_${i}" ${item.noRest2 ? 'checked' : ''} onchange="toggleNoPeriod2(${i})">
                                No rest in Period 2
                            </label>
                        </td>
                    </tr>
                </table>
            `;
            });
        }

        function setCurrentTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('currentTime').value = `${hours}:${minutes}`;
        }

        function clearDayTimes(index) {
            document.getElementById(`start1_${index}`).value = '';
            document.getElementById(`end1_${index}`).value = '';
            document.getElementById(`start2_${index}`).value = '';
            document.getElementById(`end2_${index}`).value = '';
        }

        function toggleFullRest(index) {
            const checkbox = document.getElementById(`fullRest_${index}`);
            const noRestCheckbox = document.getElementById(`noRest2_${index}`);
            if (checkbox.checked) {
                clearDayTimes(index);
                if (noRestCheckbox) noRestCheckbox.checked = false;
            }
        }

        function toggleNoPeriod2(index) {
            const checkbox = document.getElementById(`noRest2_${index}`);
            if (checkbox.checked) {
                document.getElementById(`start2_${index}`).value = '';
                document.getElementById(`end2_${index}`).value = '';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderBlocks(prefilledData);
            setCurrentTime();
            calculateVilotidCorrect();
        });

        function resetAllFields() {
            document.getElementById('date_0').value = getPastDateStr(2);
            document.getElementById('date_1').value = getPastDateStr(1);
            document.getElementById('date_2').value = getPastDateStr(0);

            for (let i = 0; i < 3; i++) {
                document.getElementById(`start1_${i}`).value = '';
                document.getElementById(`end1_${i}`).value = '';
                document.getElementById(`start2_${i}`).value = '';
                document.getElementById(`end2_${i}`).value = '';
                document.getElementById(`fullRest_${i}`).checked = false;
                const noRestBox = document.getElementById(`noRest2_${i}`);
                if (noRestBox) noRestBox.checked = false;
            }

            setCurrentTime();
            document.getElementById('driverName').value = '';
            document.getElementById('results').style.display = 'none';
        }

        function parseDateTime(date, time) {
            return date && time ? new Date(`${date}T${time}`) : null;
        }

        function parseMidnight(date) {
            return date ? new Date(`${date}T00:00`) : null;
        }

        function parseNextMidnight(date) {
            const dt = parseMidnight(date);
            if (!dt) return null;
            dt.setDate(dt.getDate() + 1);
            return dt;
        }

        function clipIntervalToRange(start, end, rangeStart, rangeEnd) {
            if (!start || !end || end <= start) return null;
            const clippedStart = start < rangeStart ? rangeStart : start;
            const clippedEnd = end > rangeEnd ? rangeEnd : end;
            return clippedEnd > clippedStart ? { start: clippedStart, end: clippedEnd } : null;
        }

        function mergeIntervals(intervals) {
            if (!intervals.length) return [];
            const sorted = intervals.slice().sort((a, b) => a.start - b.start);
            const merged = [{ ...sorted[0] }];
            for (let i = 1; i < sorted.length; i++) {
                const current = sorted[i];
                const last = merged[merged.length - 1];
                const allowedGapMs = 60 * 1000; // allow one-minute adjacency to preserve midnight-spanning rest
                if (current.start <= last.end || current.start - last.end <= allowedGapMs) {
                    last.end = new Date(Math.max(last.end.getTime(), current.end.getTime()));
                } else {
                    merged.push({ ...current });
                }
            }
            return merged;
        }

        function getLatestRestEnd(intervals, before) {
            let latest = null;
            intervals.forEach(interval => {
                if (interval.end && interval.end <= before) {
                    if (!latest || interval.end > latest) latest = interval.end;
                }
            });
            return latest;
        }

        function calculateVilotidCorrect() {
            const resultsList = document.getElementById('resultsList');
            resultsList.innerHTML = '';

            const curTimeVal = document.getElementById('currentTime').value;
            const curDateStr = document.getElementById('date_2').value;
            const yestDateStr = document.getElementById('date_1').value;

            // --- YESTERDAY'S CALCULATION (Index 1) ---
            const s1_yest = document.getElementById('start1_1').value;
            const e1_yest = document.getElementById('end1_1').value;
            const s2_yest = document.getElementById('start2_1').value;
            const e2_yest = document.getElementById('end2_1').value;

            let yestCardHTML = "";
            let r1_yest_mins = (s1_yest && e1_yest) ? Math.round((new Date(`${yestDateStr}T${e1_yest}`) - new Date(`${yestDateStr}T${s1_yest}`)) / (1000 * 60)) : 0;
            let r2_yest_mins = (s2_yest && e2_yest) ? Math.round((new Date(`${yestDateStr}T${e2_yest}`) - new Date(`${yestDateStr}T${s2_yest}`)) / (1000 * 60)) : 0;
            let totalYestRestMins = r1_yest_mins + r2_yest_mins;

            let yestWorkMins = Math.max(0, (24 * 60) - totalYestRestMins);
            let isYestCompliant = totalYestRestMins >= 11 * 60;

            const yR1H = Math.floor(r1_yest_mins / 60); const yR1M = r1_yest_mins % 60;
            const yR2H = Math.floor(r2_yest_mins / 60); const yR2M = r2_yest_mins % 60;
            const yTotH = Math.floor(totalYestRestMins / 60); const yTotM = totalYestRestMins % 60;
            const yWorkH = Math.floor(yestWorkMins / 60); const yWorkM = yestWorkMins % 60;

            yestCardHTML = `
                <div class="result-card" style="border-left-color: #64748b;">
                    <span class="badge ${isYestCompliant ? 'bg-ok' : 'bg-danger'}">${isYestCompliant ? 'COMPLIANT' : 'INCOMPLETE REST'}</span>
                    <strong>📅 Yesterday Summary (${yestDateStr || 'Not Set'}):</strong><br><br>
                    • <b>Period 1 Rest (${s1_yest || '--'} to ${e1_yest || '--'}):</b> ${yR1H}h ${yR1M}m<br>
                    • <b>Period 2 Rest (${s2_yest || '--'} to ${e2_yest || '--'}):</b> ${yR2H}h ${yR2M}m<br>
                    • <b>Total Rest Taken Yesterday:</b> <span style="color:${isYestCompliant ? 'green' : 'red'}; font-weight:bold;">${yTotH}h ${yTotM}m</span><br>
                    • <b>Calculated Work Time Yesterday:</b> ${yWorkH}h ${yWorkM}m
                </div>
            `;

            // --- TODAY'S CALCULATION (Index 2) ---
            const s1_today = document.getElementById('start1_2').value;
            const e1_today = document.getElementById('end1_2').value;
            const s2_today = document.getElementById('start2_2').value;
            const e2_today = document.getElementById('end2_2').value;
            const fullRestYest = document.getElementById('fullRest_1').checked;
            const fullRestToday = document.getElementById('fullRest_2').checked;

            let todayCardHTML = "";

            if (!curTimeVal || !curDateStr) {
                todayCardHTML = `
                <div class="result-card" style="border-left-color: var(--neutral);">
                    <span class="badge bg-info">NO DATA</span>
                    <strong>📅 Today & Active Shift Summary (${curDateStr || 'Not Set'}):</strong><br><br>
                    • <i>Please set today’s date and current time to calculate the active shift.</i>
                </div>
            `;
            } else {
                const nowDT = new Date(`${curDateStr}T${curTimeVal}`);
                const rangeStart = new Date(nowDT.getTime() - 24 * 60 * 60 * 1000);

                const restIntervals = [];
                const yest1Start = parseDateTime(yestDateStr, s1_yest);
                const yest1End = parseDateTime(yestDateStr, e1_yest);
                const yest2Start = parseDateTime(yestDateStr, s2_yest);
                const yest2End = parseDateTime(yestDateStr, e2_yest);
                const today1Start = parseDateTime(curDateStr, s1_today);
                const today1End = parseDateTime(curDateStr, e1_today);
                const today2Start = parseDateTime(curDateStr, s2_today);
                const today2End = parseDateTime(curDateStr, e2_today);

                if (fullRestYest && yestDateStr) {
                    const fullYest = clipIntervalToRange(parseMidnight(yestDateStr), parseNextMidnight(yestDateStr), rangeStart, nowDT);
                    if (fullYest) restIntervals.push(fullYest);
                } else {
                    [
                        clipIntervalToRange(yest1Start, yest1End, rangeStart, nowDT),
                        clipIntervalToRange(yest2Start, yest2End, rangeStart, nowDT)
                    ].forEach(interval => {
                        if (interval) restIntervals.push(interval);
                    });
                }

                if (fullRestToday && curDateStr) {
                    const fullToday = clipIntervalToRange(parseMidnight(curDateStr), parseNextMidnight(curDateStr), rangeStart, nowDT);
                    if (fullToday) restIntervals.push(fullToday);
                } else {
                    [
                        clipIntervalToRange(today1Start, today1End, rangeStart, nowDT),
                        clipIntervalToRange(today2Start, today2End, rangeStart, nowDT)
                    ].forEach(interval => {
                        if (interval) restIntervals.push(interval);
                    });
                }

                const mergedRest = mergeIntervals(restIntervals);
                const totalRestMins24h = mergedRest.reduce((sum, interval) => sum + Math.round((interval.end - interval.start) / (1000 * 60)), 0);
                const longestRestMins = mergedRest.reduce((max, interval) => Math.max(max, Math.round((interval.end - interval.start) / (1000 * 60))), 0);

                const has11hTotal = totalRestMins24h >= 11 * 60;
                const has8hContinuous = longestRestMins >= 8 * 60;
                const isCompliant = has11hTotal && has8hContinuous;

                const r1H = Math.floor((today1Start && today1End ? Math.round((today1End - today1Start) / (1000 * 60)) : 0) / 60);
                const r1M = Math.floor((today1Start && today1End ? Math.round((today1End - today1Start) / (1000 * 60)) : 0) % 60);
                const r2H = Math.floor((today2Start && today2End ? Math.round((today2End - today2Start) / (1000 * 60)) : 0) / 60);
                const r2M = Math.floor((today2Start && today2End ? Math.round((today2End - today2Start) / (1000 * 60)) : 0) % 60);
                const total24HRestH = Math.floor(totalRestMins24h / 60);
                const total24HRestM = totalRestMins24h % 60;
                const longestContH = Math.floor(longestRestMins / 60);
                const longestContM = longestRestMins % 60;

                todayCardHTML = `
                <div class="result-card">
                    <span class="badge ${isCompliant ? 'bg-ok' : 'bg-danger'}">${isCompliant ? 'COMPLIANT (11h total + 8h continuous)' : 'INCOMPLETE REST'}</span>
                    <strong>📅 Last 24h Rest Summary (${curDateStr}):</strong><br><br>
                    • <b>Main Rest Period (${s1_today || '--'} to ${e1_today || '--'}):</b> ${r1H}h ${r1M}m<br>
                    • <b>Mid-Shift Rest Period (${s2_today || '--'} to ${e2_today || '--'}):</b> ${r2H}h ${r2M}m<br>
                    • <b>Total Rest in Last 24h:</b> <span style="color:${has11hTotal ? 'green' : 'red'}; font-weight:bold;">${total24HRestH}h ${total24HRestM}m</span><br>
                    • <b>Longest Continuous Rest Block:</b> <span style="color:${has8hContinuous ? 'green' : 'red'}; font-weight:bold;">${longestContH}h ${longestContM}m</span><br><br>
                    • <b>Rest Rule Status:</b> ${has11hTotal ? '11h total met' : '11h total missing'} / ${has8hContinuous ? '8h continuous met' : '8h continuous missing'}
                </div>
            `;
            }

            resultsList.innerHTML = yestCardHTML + todayCardHTML;
            document.getElementById('results').style.display = 'block';
        }
    </script>

</body>

</html>
